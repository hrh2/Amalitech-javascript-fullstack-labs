<ng-container *ngIf="board">
  <nav class="board-nav">
    <a routerLink="/boards" class="btn">&larr; All boards</a>
    <div class="board-nav__adjacent">
      <a *ngIf="previousBoardId" [routerLink]="['/boards', previousBoardId]" class="btn">&larr; Previous board</a>
      <a *ngIf="nextBoardId" [routerLink]="['/boards', nextBoardId]" class="btn">Next board &rarr;</a>
    </div>
  </nav>

  <header class="board-header">
    <h1>{{ board.name }}</h1>
    <p class="board-header__description">{{ board.description }}</p>
  </header>

  <ul class="task-list">
    <li class="card task-row" *ngFor="let task of board.tasks">
      <a [routerLink]="['tasks', task.id]" routerLinkActive="task-row__link--active" class="task-row__link">
        <span class="task-row__title">{{ task.title }}</span>
        <span class="task-row__status task-row__status--{{ task.status }}">{{ task.status }}</span>
      </a>
    </li>
  </ul>
  <p class="empty-state" *ngIf="board.tasks.length === 0">This board has no tasks yet.</p>

  <!-- Nested router-outlet: renders TaskDetailComponent (child route
       'tasks/:taskId') right inside this board's own layout, without
       replacing the board header/task list above it. -->
  <div class="task-detail-slot">
    <router-outlet></router-outlet>
  </div>
</ng-container>
