<div class="modal-backdrop" *ngIf="form" (click)="cancel()">
  <app-task-form
    [form]="form"
    mode="create"
    heading="Add New Task"
    submitLabel="Create Task"
    [isSaving]="isSaving()"
    [errorMessage]="saveError()"
    (formSubmit)="save()"
    (formCancel)="cancel()"
  ></app-task-form>
</div>
