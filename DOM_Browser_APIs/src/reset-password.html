<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Your Password — Notes</title>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>
<main class="auth-page">
  <div class="auth-card">
    <div class="auth-brand"><span aria-hidden="true">🖋️</span> Notes</div>
    <h1 class="auth-title">Reset Your Password</h1>
    <p class="auth-subtitle">Choose a new password to secure your account.</p>

    <p class="auth-error" id="form-error" role="alert"></p>

    <form class="auth-form" id="reset-form" novalidate>
      <div class="field">
        <label class="field-label" for="new-password">New Password</label>
        <div class="field-input-wrap">
          <input class="field-input" type="password" id="new-password" required minlength="8" autocomplete="new-password">
          <button type="button" class="field-icon-btn" data-toggle-for="new-password" aria-label="Show password"></button>
        </div>
        <p class="field-hint"><span data-icon="info"></span> At least 8 characters.</p>
      </div>
      <div class="field">
        <label class="field-label" for="confirm-password">Confirm New Password</label>
        <div class="field-input-wrap">
          <input class="field-input" type="password" id="confirm-password" required minlength="8" autocomplete="new-password">
          <button type="button" class="field-icon-btn" data-toggle-for="confirm-password" aria-label="Show password"></button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Reset Password</button>
    </form>
  </div>
</main>
<script type="module">
  import { resetPassword } from "./js/auth.js";
  import { icons } from "./js/icons.js";

  document.querySelectorAll("[data-icon]").forEach(el => { el.innerHTML = icons[el.dataset.icon] || ""; });

  document.querySelectorAll("[data-toggle-for]").forEach((btn) => {
    btn.innerHTML = icons.eye;
    const field = document.getElementById(btn.dataset.toggleFor);
    btn.addEventListener("click", () => {
      const show = field.type === "password";
      field.type = show ? "text" : "password";
      btn.innerHTML = show ? icons.eyeOff : icons.eye;
      btn.setAttribute("aria-label", show ? "Hide password" : "Show password");
    });
  });

  const params = new URLSearchParams(window.location.search);
  const email = params.get("email") || "";

  const form = document.getElementById("reset-form");
  const errorEl = document.getElementById("form-error");
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const pw = document.getElementById("new-password").value;
    const confirm = document.getElementById("confirm-password").value;
    if (pw.length < 8) {
      errorEl.textContent = "Password must be at least 8 characters.";
      errorEl.classList.add("visible");
      return;
    }
    if (pw !== confirm) {
      errorEl.textContent = "Passwords don't match.";
      errorEl.classList.add("visible");
      return;
    }
    const result = resetPassword(email, pw);
    if (!result.ok) {
      errorEl.textContent = result.error;
      errorEl.classList.add("visible");
      return;
    }
    window.location.href = "login.html";
  });
</script>
</body>
</html>
