<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Notes</title>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>
<main class="auth-page">
  <div class="auth-card">
    <div class="auth-brand"><img src="assets/logo-light.svg" alt="Notes"></div>
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Log in to keep organizing your notes.</p>

    <p class="auth-error" id="form-error" role="alert"></p>

    <form class="auth-form" id="login-form" novalidate>
      <div class="field">
        <label class="field-label" for="email">Email Address</label>
        <div class="field-input-wrap">
          <input class="field-input" type="email" id="email" placeholder="email@example.com" required autocomplete="email">
        </div>
      </div>
      <div class="field">
        <label class="field-label" for="password">Password</label>
        <div class="field-input-wrap">
          <input class="field-input" type="password" id="password" required autocomplete="current-password">
          <button type="button" class="field-icon-btn" id="toggle-password" aria-label="Show password"></button>
        </div>
      </div>
      <p style="text-align:right;">
        <a href="forgot-password.html" style="font-size: var(--text-6-size); color: var(--color-accent); text-decoration:none;">Forgotten your password?</a>
      </p>
      <button type="submit" class="btn btn-primary btn-block">Log In</button>
    </form>

    <div class="auth-divider">Or log in with:</div>
    <button type="button" class="google-btn"><span data-icon="google"></span> Google</button>

    <p class="auth-footer">Don't have an account? <a href="signup.html">Sign up</a></p>
  </div>
</main>
<script type="module">
  import { login, redirectIfLoggedIn } from "./js/auth.js";
  import { icons } from "./js/icons.js";
  redirectIfLoggedIn();

  document.querySelectorAll("[data-icon]").forEach(el => {
    el.innerHTML = icons[el.dataset.icon] || "";
  });
  const toggleBtn = document.getElementById("toggle-password");
  toggleBtn.innerHTML = icons.eye;
  const pwField = document.getElementById("password");
  toggleBtn.addEventListener("click", () => {
    const show = pwField.type === "password";
    pwField.type = show ? "text" : "password";
    toggleBtn.innerHTML = show ? icons.eyeOff : icons.eye;
    toggleBtn.setAttribute("aria-label", show ? "Hide password" : "Show password");
  });

  const form = document.getElementById("login-form");
  const errorEl = document.getElementById("form-error");
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = pwField.value;
    const result = login(email, password);
    if (!result.ok) {
      errorEl.textContent = result.error;
      errorEl.classList.add("visible");
      return;
    }
    window.location.href = "index.html";
  });
</script>
</body>
</html>
