<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgotten Your Password — Notes</title>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>
<main class="auth-page">
  <div class="auth-card">
    <div class="auth-brand"><span aria-hidden="true">🖋️</span> Notes</div>
    <h1 class="auth-title">Forgotten your password?</h1>
    <p class="auth-subtitle">Enter your email below, and we'll send you a link to reset it.</p>

    <p class="auth-success" id="form-success" role="status">Check your inbox — a reset link is on its way.</p>

    <form class="auth-form" id="forgot-form" novalidate>
      <div class="field">
        <label class="field-label" for="email">Email Address</label>
        <div class="field-input-wrap">
          <input class="field-input" type="email" id="email" placeholder="email@example.com" required autocomplete="email">
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
    </form>

    <p class="auth-footer">Remembered it? <a href="login.html">Back to login</a></p>
  </div>
</main>
<script type="module">
  import { requestPasswordReset } from "./js/auth.js";

  const form = document.getElementById("forgot-form");
  const successEl = document.getElementById("form-success");
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    requestPasswordReset(email);
    successEl.classList.add("visible");
    // In this demo app there's no email server, so we send the learner
    // straight to the reset screen with the email pre-filled.
    setTimeout(() => {
      window.location.href = `reset-password.html?email=${encodeURIComponent(email)}`;
    }, 1200);
  });
</script>
</body>
</html>
