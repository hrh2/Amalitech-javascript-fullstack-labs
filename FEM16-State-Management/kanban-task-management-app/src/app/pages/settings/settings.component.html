<header class="page-header">
  <h1>Settings</h1>
</header>
<div class="page-content">
  <section class="card settings-card">
    <p class="settings-card__note">
      This page is protected by <code>authGuard</code> - you can only reach it while <code>AuthService</code>
      reports you as logged in.
    </p>
    <button type="button" class="btn btn--danger" (click)="logout()">Log out</button>
  </section>
</div>
