<section class="card login-card">
  <h1>Log in</h1>
  <p>
    This is a stand-in login screen for a hard-coded <code>AuthService</code>. Boards and Settings are protected
    by an <code>authGuard</code> (CanActivate) - if you followed a link to one of them, you'll be sent back there
    automatically after logging in.
  </p>
  <button type="button" class="btn btn--primary" (click)="login()">Log in</button>
</section>
